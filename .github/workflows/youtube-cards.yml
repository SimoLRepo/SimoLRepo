
name: GitHub Readme YouTube Cards

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate YouTube Playlist Cards
        uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          playlist_id: "https://www.youtube.com/watch?v=-On2OjS78os&list=PLEQ3orhIPuVs"

          lang: en
          comment_tag_name: YOUTUBE-CARDS

          max_videos: 10
          card_width: 250
          border_radius: 8

          background_color: "#0d1117"
          title_color: "#ffffff"
          stats_color: "#dedede"

          max_title_lines: 2

          show_duration: false

          readme_path: README.md
          output_only: false
          output_type: markdown
